<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robô Zezinho - TikTok Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; width: 100vw; background: #0f172a; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    /* PAINEL LATERAL */
    .sidebar { width: 380px; background: #1e293b; padding: 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; border-right: 1px solid #334155; }
    .sidebar h2 { font-size: 18px; }
    .card { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    .card label { font-size: 11px; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 5px; text-transform: uppercase; }
    
    .input-group { display: flex; gap: 6px; margin-bottom: 6px; }
    input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 12px; outline: none; }
    button { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-success { background: #06b6d4; color: #fff; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-pink { background: #ec4899; color: #fff; }
    .btn-purple { background: #8b5cf6; color: #fff; }
    .btn-secondary { background: #475569; color: #fff; width: 100%; margin-top: 5px; }
    
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    
    .logs { flex: 1; min-height: 100px; font-family: monospace; font-size: 10px; color: #67e8f9; background: #020617; padding: 8px; border-radius: 6px; overflow-y: auto; }

    /* PREVIEW MOBILE */
    .preview { flex: 1; display: flex; align-items: center; justify-content: center; background: #020617; padding: 10px; }
    .phone {
      width: 360px; height: 680px; border-radius: 30px; border: 8px solid #1e293b;
      position: relative; overflow: hidden; background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
    }

    /* TOP 10 RANKING BOX */
    .ranking-box {
      position: absolute; top: 50px; right: 10px; width: 130px;
      background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 8px; padding: 6px; z-index: 10; font-size: 9px;
    }
    .r-tabs { display: flex; gap: 4px; margin-bottom: 4px; }
    .r-tab { flex: 1; text-align: center; background: #334155; padding: 2px; border-radius: 3px; cursor: pointer; font-weight: bold; }
    .r-tab.active { background: #06b6d4; color: #000; }
    .r-list { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .r-item { display: flex; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 2px 4px; border-radius: 3px; }

    /* CABEÇALHO TIKTOK */
    .tt-header { display: flex; justify-content: space-between; align-items: center; z-index: 5; }
    .badge { background: #06b6d4; color: #000; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    .user { font-size: 11px; font-weight: bold; }

    /* ROBÔ CENTRAL */
    .robot-container { text-align: center; z-index: 5; margin-top: 20px; }
    .robot-svg { width: 180px; height: 180px; transition: transform 0.1s; }
    .robot-container.speaking .robot-svg { animation: bounce 0.2s infinite alternate; }
    @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

    /* BALÃO E CHAT */
    .bubble { background: rgba(15, 23, 42, 0.95); border: 2px solid #06b6d4; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #67e8f9; text-align: center; z-index: 5; }
    .chat { height: 110px; display: flex; flex-direction: column-reverse; gap: 4px; overflow: hidden; z-index: 5; }
    .msg { background: rgba(15, 23, 42, 0.8); padding: 4px 8px; border-radius: 6px; font-size: 10px; border-left: 2px solid #06b6d4; }
  </style>
</head>
<body>

  <!-- PAINEL DE CONTROLE -->
  <div class="sidebar">
    <h2>🤖 Robô Zezinho</h2>
    
    <div class="card">
      <label>Conexão TikTok</label>
      <div class="input-group">
        <input type="text" id="userIn" placeholder="@seu_usuario">
        <button class="btn-success" id="btnCon" onclick="toggleConn()">Conectar</button>
      </div>
      <span id="stTxt" style="font-size:10px; color:#f87171;">● Desconectado</span>
    </div>

    <div class="card">
      <label>Pedir na Live</label>
      <div class="grid2">
        <button class="btn-pink" onclick="askTap()">👉 Pedir Taps</button>
        <button class="btn-warning" onclick="askCoin()">🪙 Pedir Moedas</button>
      </div>
    </div>

    <div class="card">
      <label>Falar Frase Personalizada</label>
      <div class="input-group">
        <input type="text" id="customTxt" placeholder="O que ele vai falar?">
        <button class="btn-warning" onclick="sendCustom()">Falar</button>
      </div>
    </div>

    <div class="card">
      <label>Simulador de Teste</label>
      <div class="input-group">
        <input type="text" id="simName" value="Fã_Top1" placeholder="Nome">
        <input type="number" id="simVal" value="10" style="width: 60px;" placeholder="Qtd">
      </div>
      <div class="grid2" style="margin-bottom:6px;">
        <button class="btn-pink" onclick="simTap()">Simular Taps</button>
        <button class="btn-warning" onclick="simCoin()">Simular Moedas</button>
      </div>
      <div class="grid2">
        <button class="btn-primary" onclick="simFollow()">Novo Seguidor</button>
        <button class="btn-purple" onclick="simChat()">Pergunta Chat</button>
      </div>
      <button class="btn-secondary" onclick="resetRank()">Zerar Placar</button>
    </div>

    <div class="card" style="flex:1; display:flex; flex-direction:column;">
      <label>Logs</label>
      <div class="logs" id="logBox"><div>Sistema pronto.</div></div>
    </div>
  </div>

  <!-- TELA DO CELULAR / PREVIEW -->
  <div class="preview">
    <div class="phone">
      
      <!-- RANKING TOP 10 -->
      <div class="ranking-box">
        <div class="r-tabs">
          <div class="r-tab active" id="tabT" onclick="switchR('taps')">Taps</div>
          <div class="r-tab" id="tabC" onclick="switchR('coins')">Coins</div>
        </div>
        <div class="r-list" id="rList">
          <div style="text-align:center; color:#64748b;">Sem dados</div>
        </div>
      </div>

      <!-- HEADER -->
      <div class="tt-header">
        <div><span class="badge">AO VIVO</span></div>
        <div class="user" id="dispUser">@robo_zezinho</div>
      </div>

      <!-- PERSONAGEM -->
      <div class="robot-container" id="robotBox">
        <svg class="robot-svg" viewBox="0 0 240 240">
          <!-- Antena -->
          <line x1="120" y1="40" x2="120" y2="15" stroke="#06b6d4" stroke-width="4"/>
          <circle cx="120" cy="10" r="6" fill="#ef4444"/>
          <!-- Cabeça -->
          <rect x="60" y="40" width="120" height="85" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="3"/>
          <!-- Olhos -->
          <circle cx="90" cy="75" r="12" fill="#0284c7"/>
          <circle cx="150" cy="75" r="12" fill="#0284c7"/>
          <circle cx="92" cy="73" r="4" fill="#fff"/>
          <circle cx="152" cy="73" r="4" fill="#fff"/>
          <!-- Boca Fechada -->
          <rect id="mouthC" x="90" y="95" width="60" height="8" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
          <!-- Boca Aberta (Animada) -->
          <rect id="mouthO" x="90" y="93" width="60" height="14" rx="5" fill="#06b6d4" style="display:none;"/>
          <!-- Corpo -->
          <rect x="75" y="135" width="90" height="70" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="3"/>
          <circle cx="120" cy="170" r="8" fill="#eab308"/>
        </svg>
      </div>

      <!-- BALÃO -->
      <div class="bubble" id="bubble">
        Cara, se eu soubesse que live dava trabalho, tava dormindo!
      </div>

      <!-- CHAT -->
      <div class="chat" id="chatList">
        <div class="msg"><b>Lucas:</b> Enviou 10 Taps 👉</div>
      </div>

    </div>
  </div>

  <script>
    let connected = false;
    let tab = 'taps';
    let tapsRank = [];
    let coinsRank = [];

    function log(msg) {
      const box = document.getElementById('logBox');
      box.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>` + box.innerHTML;
    }

    function toggleConn() {
      const u = document.getElementById('userIn').value.trim();
      if(!u) { alert('Digite seu @ do TikTok'); return; }
      connected = !connected;
      const btn = document.getElementById('btnCon');
      const st = document.getElementById('stTxt');
      if(connected) {
        btn.innerText = 'Desconectar';
        btn.className = 'btn-warning';
        st.innerText = '● Conectado a ' + u;
        st.style.color = '#22d3ee';
        document.getElementById('dispUser').innerText = u.startsWith('@') ? u : '@'+u;
        log('Conectado com sucesso!');
        speak('Caramba, ' + u + '! A live começou, bora engajar!');
      } else {
        btn.innerText = 'Conectar';
        btn.className = 'btn-success';
        st.innerText = '● Desconectado';
        st.style.color = '#f87171';
        log('Desconectado.');
      }
    }

    function speak(text) {
      document.getElementById('bubble').innerText = text;
      const box = document.getElementById('robotBox');
      const mC = document.getElementById('mouthC');
      const mO = document.getElementById('mouthO');

      box.classList.add('speaking');
      mC.style.display = 'none';
      mO.style.display = 'block';

      if('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'pt-BR';
        utter.pitch = 1.15;
        utter.rate = 1.25;
        
        const voices = window.speechSynthesis.getVoices();
        const v = voices.find(vo => vo.lang.includes('pt') && !vo.name.toLowerCase().includes('robot'));
        if(v) utter.voice = v;

        utter.onend = stopSpeak;
        utter.onerror = stopSpeak;
        window.speechSynthesis.speak(utter);
      } else {
        setTimeout(stopSpeak, 3000);
      }
    }

    function stopSpeak() {
      document.getElementById('robotBox').classList.remove('speaking');
      document.getElementById('mouthC').style.display = 'block';
      document.getElementById('mouthO').style.display = 'none';
    }

    function askTap() {
      speak("Caramba, pessoal! Mete o dedo na tela pra bater a meta de curtidas!");
      log("Pediu taps.");
    }

    function askCoin() {
      speak("Quem puder mandar moedas vai salvar minha vida nessa live!");
      log("Pediu moedas.");
    }

    function sendCustom() {
      const t = document.getElementById('customTxt').value.trim();
      if(t) { speak(t); log("Fala injetada: " + t); document.getElementById('customTxt').value = ''; }
    }

    function addChat(user, txt) {
      const list = document.getElementById('chatList');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<b>${user}:</b> ${txt}`;
      list.prepend(div);
    }

    function updateR(list, name, val) {
      let item = list.find(i => i.name.toLowerCase() === name.toLowerCase());
      if(item) item.val += val; else list.push({name, val});
      list.sort((a,b) => b.val - a.val);
      if(list.length > 10) list.pop();
      renderR();
    }

    function renderR() {
      const box = document.getElementById('rList');
      box.innerHTML = '';
      const list = tab === 'taps' ? tapsRank : coinsRank;
      if(list.length === 0) { box.innerHTML = '<div style="text-align:center; color:#64748b;">Sem dados</div>'; return; }
      list.forEach((item, idx) => {
        box.innerHTML += `<div class="r-item"><span>#${idx+1} ${item.name}</span><b>${item.val}</b></div>`;
      });
    }

    function switchR(t) {
      tab = t;
      document.getElementById('tabT').className = 'r-tab ' + (t==='taps'?'active':'');
      document.getElementById('tabC').className = 'r-tab ' + (t==='coins'?'active':'');
      renderR();
    }

    function resetRank() {
      tapsRank = []; coinsRank = [];
      renderR();
      log("Placar zerado.");
    }

    function simTap() {
      const n = document.getElementById('simName').value || 'Anônimo';
      const v = parseInt(document.getElementById('simVal').value) || 5;
      updateR(tapsRank, n, v);
      addChat(n, `Enviou ${v} Taps 👉`);
      speak(`Valeu pelos taps, ${n}!`);
    }

    function simCoin() {
      const n = document.getElementById('simName').value || 'Anônimo';
      const v = parseInt(document.getElementById('simVal').value) || 10;
      updateR(coinsRank, n, v);
      addChat(n, `Enviou ${v} Moedas 🪙`);
      speak(`Caramba, ${n}! Obrigado pelas moedas!`);
    }

    function simFollow() {
      const n = document.getElementById('simName').value || 'Novo_Seguidor';
      addChat(n, `Começou a seguir! 👤`);
      speak(`Bem-vindo ao caos, ${n}!`);
    }

    function simChat() {
      const n = document.getElementById('simName').value || 'Curioso';
      addChat(n, `Zezinho, de onde você é?`);
      speak(`Eu vim de um lugar onde as pessoas não fazem perguntas difíceis!`);
    }
  </script>
</body>
</html>
